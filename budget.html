<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Budget - TripCraft</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            ✈️ TripCraft
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="destinations.html"> Destinations </a>
            <a href="planner.html"> Planner </a>
            <a href="budget.html"> Budget </a>
            <a href="packing.html"> Packing </a>
            <a href="my-trips.html"> My Trips </a>
            <button id="themeBtn" class="theme-btn">🌙 </button>
        </div>

    </nav>

    <section class="page-header">
        <h1> Travel Budget </h1>
        <p> Calculate your estimated travel expenses. </p>
    </section>

    <section class="section">
        <div class="budget-container">
            <div class="form-card">
                <h2>Enter Your Expenses </h2>
                <div class="form-group">
                    <label for="transport"> Transport </label>
                    <input type="number" id="transport" placeholder="Enter amount" min="0">
                </div>

                <div class="form-group">
                    <label for="hotel"> Hotel</label>
                    <input type="number" id="hotel" placeholder="Enter amount" min="0">
                </div>


                <div class="form-group">

                    <label for="food">
                        Food
                    </label>

                    <input
                        type="number"
                        id="food"
                        placeholder="Enter amount"
                        min="0"
                    >

                </div>


                <div class="form-group">

                    <label for="activities">
                        Activities
                    </label>

                    <input
                        type="number"
                        id="activities"
                        placeholder="Enter amount"
                        min="0"
                    >

                </div>


                <div class="form-group">

                    <label for="shopping">
                        Shopping
                    </label>

                    <input
                        type="number"
                        id="shopping"
                        placeholder="Enter amount"
                        min="0"
                    >

                </div>


                <div class="form-group">

                    <label for="other">
                        Other
                    </label>

                    <input
                        type="number"
                        id="other"
                        placeholder="Enter amount"
                        min="0"
                    >

                </div>


                <button
                    id="calculateBtn"
                    class="btn">

                    Calculate Budget

                </button>


            </div>



            <div class="budget-result">

                <h2>
                    Budget Summary
                </h2>


                <div class="budget-row">

                    <span>
                        Transport
                    </span>

                    <span id="transportResult">
                        ৳ 0
                    </span>

                </div>


                <div class="budget-row">

                    <span>
                        Hotel
                    </span>

                    <span id="hotelResult">
                        ৳ 0
                    </span>

                </div>


                <div class="budget-row">

                    <span>
                        Food
                    </span>

                    <span id="foodResult">
                        ৳ 0
                    </span>

                </div>


                <div class="budget-row">

                    <span>
                        Activities
                    </span>

                    <span id="activitiesResult">
                        ৳ 0
                    </span>

                </div>


                <div class="budget-row">

                    <span>
                        Shopping
                    </span>

                    <span id="shoppingResult">
                        ৳ 0
                    </span>

                </div>


                <div class="budget-row">

                    <span>
                        Other
                    </span>

                    <span id="otherResult">
                        ৳ 0
                    </span>

                </div>


                <div class="total-budget">

                    <span>
                        Total Budget
                    </span>

                    <span id="totalBudget">
                        ৳ 0
                    </span>

                </div>


            </div>


        </div>

    </section>


    <footer>
        <p> © 2026 TripCraft. All Rights Reserved.</p>

    </footer>


    <script src="js/main.js"></script>
    <script src="js/budget.js"></script>

</body>

</html>
