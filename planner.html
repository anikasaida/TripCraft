<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner - TripCraft</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">✈️ TripCraft</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="destinations.html">Destinations</a>
            <a href="planner.html">Planner</a>
            <a href="budget.html">Budget</a>
            <a href="packing.html">Packing</a>
            <a href="my-trips.html">My Trips</a>
            <button id="themeBtn" class="theme-btn">🌙</button>
        </div>
    </nav>

    <section class="page-header">
        <h1>Plan Your Trip</h1>
        <p>Create your travel plan easily.</p>
    </section>

    <section class="section">

        <div class="form-card">

            <h2>Trip Information</h2>

            <div class="form-group">
                <label for="tripName">Trip Name</label>
                <input type="text" id="tripName" placeholder="Example: Cox's Bazar Tour">
            </div>

            <div class="form-group">
                <label for="destination">Destination</label>
                <select id="destination">
                    <option value="">Select Destination</option>
                    <option value="Cox's Bazar">Cox's Bazar</option>
                    <option value="Sajek Valley">Sajek Valley</option>
                    <option value="Sylhet">Sylhet</option>
                    <option value="Bandarban">Bandarban</option>
                    <option value="Paris">Paris</option>
                    <option value="Bali">Bali</option>
                </select>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate">
                </div>

                <div class="form-group">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate">
                </div>

            </div>

            <div class="form-group">
                <label for="travelers">Number of Travelers</label>
                <input type="number" id="travelers" min="1" value="1">
            </div>

            <button id="createTripBtn" class="btn">Create Trip</button>

        </div>

    </section>

    <footer>
        <p>© 2026 TripCraft. All Rights Reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/planner.js"></script>

</body>

</html>
